sonar.projectKey=gowthamsaikadali_Automobile-Manufacturing-Dashboard-SonarQube-Trivy-Security

# Self-hosted SonarQube (EC2) does NOT use sonar.organization -- that key is
# SonarCloud-only and self-hosted SonarQube will reject the scan if it's
# present. Do not add it back.

# Python app lives under app/ -- point the scanner there so it doesn't
# also try to analyze terraform/k8s YAML as source code.
sonar.sources=app
sonar.python.version=3.12
