sonar.projectKey=automobile-manufacturing-dashboard
# Note: sonar.organization is a SonarCloud-only setting -- omit it for a
# self-hosted (EC2) SonarQube instance, or the scan will fail with an
# "organization is not supported" style error.

# Python app lives under app/ -- point the scanner there so it doesn't
# also try to analyze terraform/k8s YAML as source code
sonar.sources=app
sonar.python.version=3.12
