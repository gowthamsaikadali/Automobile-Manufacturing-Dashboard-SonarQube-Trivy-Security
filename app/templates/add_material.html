{% extends "base.html" %}
{% block title %}Add Material - Auto Unit{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Add Material</h1>
    <p class="page-sub">Register a new raw material in the catalog</p>
  </div>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('add_material') }}">
    <label for="name">Material Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Steel Sheet" required>

    <label for="category">Category</label>
    <input type="text" id="category" name="category" placeholder="e.g. Chassis, Electrical, Interior" required>

    <label for="quantity">Initial Quantity</label>
    <input type="number" id="quantity" name="quantity" value="0" min="0" required>

    <label for="unit">Unit</label>
    <input type="text" id="unit" name="unit" placeholder="e.g. kg, units, meters">

    <button type="submit" class="btn-primary">Save Material</button>
  </form>
</div>
{% endblock %}
