# ClusterSecretStore (cluster-scoped, no namespace of its own) instead of a
# namespaced SecretStore. This matters: a namespaced SecretStore can only
# authenticate via a ServiceAccount in its OWN namespace -- it's a deliberate
# security restriction in External Secrets Operator. Since our
# external-secrets-sa lives in the external-secrets namespace but we need
# ExternalSecrets in automobile-app to use it, ClusterSecretStore is the
# officially supported way to bridge that -- it allows an explicit
# `namespace:` on the serviceAccountRef.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-credentials
  namespace: automobile-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: automobile-project/app-credentials # matches secrets-manager.tf secret name
