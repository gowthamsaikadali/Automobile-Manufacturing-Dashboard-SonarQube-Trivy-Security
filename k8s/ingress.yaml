apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: automobile-app-ingress
  namespace: automobile-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # No domain / ACM cert -- app is served over the ALB's own
    # *.elb.amazonaws.com DNS name on plain HTTP. If you get a domain
    # later, this is the only file you'd need to add HTTPS annotations to.
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: automobile-app-svc
                port:
                  number: 80
